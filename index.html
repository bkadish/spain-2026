<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Spain 2026</title>

<style>
  :root{
    --bg:#faf9f7; --ink:#1c1b1a; --muted:#6d6a66; --line:#e2ded8;
    --card:#fff; --accent:#2f6ea8; --warn:#b0741f; --bad:#b3392f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17181a; --ink:#ececec; --muted:#9d9a96; --line:#2e3033;
           --card:#1f2124; --accent:#6fa8dc; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #app{display:flex;flex-direction:column;height:100%}
  header{padding:10px 12px calc(6px + env(safe-area-inset-top)) 12px;
    border-bottom:1px solid var(--line);background:var(--card)}
  h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
  #count{color:var(--muted);font-size:12.5px;margin-top:2px}
  #filters{display:flex;flex-direction:column;gap:6px;padding:8px 12px;
    background:var(--card);border-bottom:1px solid var(--line)}
  .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .row::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:5px 10px;border:1px solid var(--line);border-radius:999px;
    background:transparent;color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  #main{flex:1;display:flex;min-height:0}
  #map{flex:1;min-width:0}
  #list{width:340px;max-width:45%;overflow-y:auto;border-left:1px solid var(--line);
    background:var(--card);-webkit-overflow-scrolling:touch}
  @media (max-width:760px){
    #main{flex-direction:column}
    #map{height:44vh;flex:none}
    #list{width:100%;max-width:none;border-left:none;border-top:1px solid var(--line);flex:1}
  }
  .item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:hover{background:rgba(127,127,127,.06)}
  .item.sel{background:rgba(47,110,168,.10)}
  .nm{font-weight:600;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;transform:translateY(-1px)}
  .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .b{font-size:11px;padding:2px 6px;border-radius:4px;border:1px solid var(--line);
     color:var(--muted);white-space:nowrap}
  .b.dog{color:#2e7d4f;border-color:#2e7d4f66}
  .b.nodog{color:var(--bad);border-color:#b3392f66}
  .b.book{color:#fff;background:var(--accent);border-color:var(--accent)}
  .b.warn{color:var(--warn);border-color:#b0741f66}
  .b.star{color:#8a6d1f;border-color:#8a6d1f66}
  .note{color:var(--muted);font-size:12.5px;margin-top:6px;white-space:pre-wrap}
  .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .btn{font-size:12.5px;padding:6px 10px;border-radius:7px;text-decoration:none;
    border:1px solid var(--accent);color:var(--accent)}
  .btn.solid{background:var(--accent);color:#fff}
  .empty{padding:26px 14px;color:var(--muted);text-align:center}
  .leaflet-popup-content{margin:9px 11px;font:13px/1.4 -apple-system,sans-serif}
</style>
</head>

  </div>
</div>

erasategui.com — book far ahead", "commitment": false, "confidence": "weak"}, {"name": "Monte Ulia", "kind": "sight", "city": "San Sebastián", "days": [12], "dog": "off-leash", "stars": 0, "lat": 43.32192, "lng": -1.9577423, "notes": "Day: Day 12 (Fri)\nLocation: East end of San Sebastian (from Zurriola Beach)\nDog: OFF-LEASH 18:00-12:00 (noon) — exceptional for morning walks\nNotes: San Sebastian's \"wildest\" mountain. Dramatic cliff-top paths, hidden coves, ancient whale-watching lookout points. Talaia Trail is the most secluded.", "commitment": false, "confidence": "exact"}, {"name": "Pasaia Fishing Village", "kind": "other", "city": "Gipuzkoa", "days": [12], "dog": "", "stars": 0, "lat": 43.3239952, "lng": -1.9200587, "notes": "Day: Day 12 (Fri)\nLocation: ~10 min east of San Sebastian\nNotes: Charming fishing village. Can combine with Monte Ulia walk.", "commitment": false, "confidence": "exact"}, {"name": "BCN airport", "kind": "other", "city": "", "days": [13], "dog": "", "stars": 0, "lat": 41.296944, "lng": 2.0790474, "notes": "", "commitment": false, "confidence": "exact"}, {"name": "BIO airport", "kind": "other", "city": "", "days": [13], "dog": "", "stars": 0, "lat": 43.3017604, "lng": -2.9189942, "notes": "", "commitment": false, "confidence": "exact"}, {"name": "Guggenheim Bilbao", "kind": "other", "city": "Bizkaia", "days": [13], "dog": "", "stars": 0, "lat": 43.2630018, "lng": -2.9350039, "notes": "Day: Day 13 (Sat) — if time before flight\nLocation: Bilbao\nDog: No dogs inside; dog can enjoy Nervion River promenade\nNotes: Quick stop for exterior photos. The building itself and the Puppy flower sculpture are the experience.", "commitment": false, "confidence": "exact"}, {"name": "Txakolina", "kind": "cafe", "city": "Gipuzkoa", "days": [13], "dog": "", "stars": 0, "lat": 43.3244936, "lng": -1.9848206, "notes": "", "commitment": false, "confidence": "exact"}], "dayCount": 13, "kindColour": {"restaurant": "#c1443c", "cafe": "#b5651d", "winery": "#7b3f6b", "market": "#1f7a5a", "sight": "#2f6ea8", "beach": "#0f8ba8", "lodging": "#4a4a4a", "air": "#6b6b6b", "car": "#6b6b6b", "activity": "#3f7a3f", "other": "#787878"}, "kindLabel": {"restaurant": "Eat", "cafe": "Coffee", "winery": "Wine", "market": "Market", "sight": "See", "beach": "Beach", "lodging": "Stay", "activity": "Do", "air": "Flight", "car": "Car", "other": "Other"}};
const P = DATA.places;
const COL = DATA.kindColour, LAB = DATA.kindLabel;

const state = {day:null, kinds:new Set(), dog:false, booked:false, exact:false,
               near:false, here:null, sel:null};

const map = L.map('map', {zoomControl:false}).setView([43.2,-5.6], 7);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);

const layer = L.layerGroup().addTo(map);
let hereMarker = null;

// Ordinals, never dates: this page is public and carries the lodging.
const fmtDay = n => 'Day '+n;
const dist = (a,b,c,d) => {          // km, haversine
  const R=6371, r=Math.PI/180;
  const dLa=(c-a)*r, dLo=(d-b)*r;
  const h=Math.sin(dLa/2)**2 + Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
};

function chip(parent, label, pressed, onClick){
  const b=document.createElement('button');
  b.className='chip'; b.textContent=label;
  b.setAttribute('aria-pressed', pressed?'true':'false');
  b.onclick=()=>{ onClick(); render(); };
  parent.appendChild(b); return b;
}

function buildFilters(){
  const days=[...new Set(P.flatMap(p=>p.days))].sort((a,b)=>a-b);
  const fd=document.getElementById('fDay'); fd.innerHTML='';
  chip(fd,'All days', state.day===null, ()=>state.day=null);
  days.forEach(d=>chip(fd, fmtDay(d), state.day===d, ()=>state.day = state.day===d?null:d));

  const kinds=[...new Set(P.map(p=>p.kind))]
      .sort((a,b)=>(LAB[a]||a).localeCompare(LAB[b]||b));
  const fk=document.getElementById('fKind'); fk.innerHTML='';
  kinds.forEach(k=>chip(fk, LAB[k]||k, state.kinds.has(k),
      ()=>state.kinds.has(k)?state.kinds.delete(k):state.kinds.add(k)));

  const ff=document.getElementById('fFlag'); ff.innerHTML='';
  chip(ff,'🐕 dog OK', state.dog, ()=>state.dog=!state.dog);
  chip(ff,'Booked', state.booked, ()=>state.booked=!state.booked);
  chip(ff,'Exact pins only', state.exact, ()=>state.exact=!state.exact);
  chip(ff,'📍 Near me', state.near, ()=>{
    state.near=!state.near;
    if(state.near) locate();
  });
}

function locate(){
  if(!navigator.geolocation){ alert('This browser has no location service.'); return; }
  navigator.geolocation.watchPosition(pos=>{
    state.here=[pos.coords.latitude, pos.coords.longitude];
    if(hereMarker) map.removeLayer(hereMarker);
    hereMarker=L.circleMarker(state.here,{radius:7,color:'#fff',weight:2,
      fillColor:'#2f6ea8',fillOpacity:1}).addTo(map).bindPopup('You are here');
    render();
  }, err=>{ alert('Location unavailable: '+err.message); state.near=false; render(); },
     {enableHighAccuracy:true, maximumAge:15000, timeout:15000});
}

function visible(){
  let out = P.filter(p=>{
    if(state.day && !p.days.includes(state.day)) return false;
    if(state.kinds.size && !state.kinds.has(p.kind)) return false;
    if(state.dog && !(p.dog==='friendly'||p.dog==='off-leash')) return false;
    if(state.booked && !p.commitment) return false;
    if(state.exact && p.confidence!=='exact') return false;
    return true;
  });
  if(state.near && state.here){
    out.forEach(p=>p._km=dist(state.here[0],state.here[1],p.lat,p.lng));
    out.sort((a,b)=>a._km-b._km);
  }
  return out;
}

function dirLinks(p){
  const nav=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
  const search=`https://www.google.com/maps/search/?api=1&query=`+
        encodeURIComponent(p.name+' '+(p.city||''));
  let html=`<a class="btn solid" target="_blank" rel="noopener" href="${nav}">Directions</a>`;
  // An approximate pin is the STREET, not the door. Offer Google's own search
  // as well rather than navigating confidently to the wrong building.
  if(p.confidence!=='exact')
    html+=`<a class="btn" target="_blank" rel="noopener" href="${search}">Find on Google</a>`;
  return html;
}

function badges(p){
  let b='';
  if(p.stars) b+=`<span class="b star">${'★'.repeat(p.stars)} Michelin</span>`;
  if(p.dog==='friendly') b+='<span class="b dog">🐕 dog-friendly</span>';
  if(p.dog==='off-leash') b+='<span class="b dog">🐕 off-leash OK</span>';
  if(p.dog==='no') b+='<span class="b nodog">🚫 no dogs</span>';
  if(p.commitment) b+='<span class="b book">BOOKED</span>';
  if(p.confidence==='weak') b+='<span class="b warn">⚠ approximate</span>';
  if(p.confidence==='map') b+='<span class="b warn">⚠ unverified pin</span>';
  return b;
}

function render(){
  buildFilters();
  const vis=visible();
  document.getElementById('count').textContent =
    `${vis.length} of ${P.length} places` +
    (state.near&&state.here?' · nearest first':'') +
    (state.day?` · ${fmtDay(state.day)}`:'');

  layer.clearLayers();
  vis.forEach(p=>{
    const m=L.circleMarker([p.lat,p.lng],{radius:7,weight:2,color:'#fff',
      fillColor:COL[p.kind]||'#787878',fillOpacity:.95}).addTo(layer);
    m.bindPopup(`<b>${p.name}</b><br>${p.city||''}` +
      `<div class="badges">${badges(p)}</div>` +
      `<div class="acts">${dirLinks(p)}</div>`);
    m.on('click',()=>{ state.sel=p.name; drawList(vis); });
  });
  drawList(vis);
  if(vis.length && !state.near){
    const g=L.featureGroup(layer.getLayers());
    try{ map.fitBounds(g.getBounds().pad(.15)); }catch(e){}
  }
}

function drawList(vis){
  const el=document.getElementById('list');
  if(!vis.length){ el.innerHTML='<div class="empty">Nothing matches those filters.</div>'; return; }
  el.innerHTML = vis.map(p=>{
    const days=p.days.map(fmtDay).join(', ');
    const km = (p._km!==undefined) ? ` · ${p._km<1?Math.round(p._km*1000)+' m':p._km.toFixed(1)+' km'}` : '';
    return `<div class="item ${state.sel===p.name?'sel':''}" data-n="${encodeURIComponent(p.name)}">
      <div class="nm"><span class="dot" style="background:${COL[p.kind]||'#787878'}"></span>${p.name}</div>
      <div class="meta">${LAB[p.kind]||p.kind}${p.city?' · '+p.city:''}${days?' · '+days:''}${km}</div>
      <div class="badges">${badges(p)}</div>
      ${p.notes?`<div class="note">${p.notes.replace(/</g,'&lt;')}</div>`:''}
      <div class="acts">${dirLinks(p)}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.item').forEach(node=>{
    node.onclick=e=>{
      if(e.target.tagName==='A') return;
      const n=decodeURIComponent(node.dataset.n);
      const p=P.find(x=>x.name===n);
      state.sel=n; map.setView([p.lat,p.lng], 15); drawList(visible());
    };
  });
}

render();
</script>
