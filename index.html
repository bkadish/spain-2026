<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Spain 2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#faf9f7; --ink:#1c1b1a; --muted:#6d6a66; --line:#e2ded8;
    --card:#fff; --accent:#2f6ea8; --warn:#b0741f; --bad:#b3392f;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17181a; --ink:#ececec; --muted:#9d9a96; --line:#2e3033;
           --card:#1f2124; --accent:#6fa8dc; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  #app{display:flex;flex-direction:column;height:100%}
  header{padding:10px 12px calc(6px + env(safe-area-inset-top)) 12px;
    border-bottom:1px solid var(--line);background:var(--card)}
  h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
  #count{color:var(--muted);font-size:12.5px;margin-top:2px}
  /* The call sheet is a sibling page in this repo. Without a link from here it
     is a URL Ben has to be told, once, and then find again on a phone. */
  a.xlink{display:inline-block;margin-top:5px;font-size:12.5px;color:var(--accent);
    text-decoration:none;font-weight:600}
  #filters{display:flex;flex-direction:column;gap:6px;padding:8px 12px;
    background:var(--card);border-bottom:1px solid var(--line)}
  .srch{position:relative;display:flex}
  .srch input{flex:1;font:inherit;font-size:15px;padding:9px 32px 9px 11px;
    border:1px solid var(--line);border-radius:9px;background:transparent;
    color:var(--ink);-webkit-appearance:none;appearance:none}
  .srch input::-webkit-search-cancel-button{display:none}
  .srch input:focus{outline:none;border-color:var(--accent)}
  .srch button{position:absolute;right:1px;top:1px;bottom:1px;width:30px;
    border:0;background:transparent;color:var(--muted);font-size:20px;
    line-height:1;cursor:pointer;border-radius:0 9px 9px 0}
  .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .row::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:5px 10px;border:1px solid var(--line);border-radius:999px;
    background:transparent;color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  #main{flex:1;display:flex;min-height:0}
  #map{flex:1;min-width:0}
  #list{width:340px;max-width:45%;overflow-y:auto;border-left:1px solid var(--line);
    background:var(--card);-webkit-overflow-scrolling:touch}
  @media (max-width:760px){
    #main{flex-direction:column}
    #map{height:44vh;flex:none}
    #list{width:100%;max-width:none;border-left:none;border-top:1px solid var(--line);flex:1}
  }
  .item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:hover{background:rgba(127,127,127,.06)}
  .item.sel{background:rgba(47,110,168,.10)}
  .nm{font-weight:600;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;transform:translateY(-1px)}
  .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
  .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .b{font-size:11px;padding:2px 6px;border-radius:4px;border:1px solid var(--line);
     color:var(--muted);white-space:nowrap}
  .b.dog{color:#2e7d4f;border-color:#2e7d4f66}
  .b.nodog{color:var(--bad);border-color:#b3392f66}
  .b.book{color:#fff;background:var(--accent);border-color:var(--accent)}
  .b.warn{color:var(--warn);border-color:#b0741f66}
  .b.star{color:#8a6d1f;border-color:#8a6d1f66}
  .b.shut{color:#fff;background:var(--bad);border-color:var(--bad)}
  .b.ask{color:var(--warn);border-color:#b0741f66;border-style:dashed}
  .why{color:var(--muted);font-size:11.5px;margin-top:4px;font-style:italic}
  .known{font-size:12.5px;margin-top:5px}
  .hrs{color:var(--muted);font-size:12px;margin-top:4px}
  .note{color:var(--muted);font-size:12.5px;margin-top:6px;white-space:pre-wrap}
  .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .btn{font-size:12.5px;padding:6px 10px;border-radius:7px;text-decoration:none;
    border:1px solid var(--accent);color:var(--accent)}
  .btn.solid{background:var(--accent);color:#fff}
  .empty{padding:26px 14px;color:var(--muted);text-align:center}
  .leaflet-popup-content{margin:9px 11px;font:13px/1.4 -apple-system,sans-serif}
</style>
</head>

\nLocation: Hotel Arbaso, Zubieta Kalea, San Sebastian\nType: Michelin Guide, seasonal/market cuisine\nHours: Thu 7:30 AM-11:30 PM\nDog: Call +34 943 423 349", "confidence": "google", "outdoor": true, "open": {"11": "7:30 AM – 12:30 AM"}, "summary": "Sleek, modern dining room & terrace serving refined Basque dishes & pincho snacks.", "rating": 4.3, "ratings": 2810, "website": "http://narru.es/"}, {"name": "Paseo Marítimo", "kind": "sight", "city": "San Sebastián", "region": "Galicia", "days": [11], "dog": "friendly", "lat": 43.3796494, "lng": -8.4080394, "confidence": "exact", "dogSrc": "you", "dogWhy": "Paseo Marítimo walk with dog", "open": {}, "rating": 4.7, "ratings": 35, "unchecked": true}, {"name": "Paseo Nuevo", "kind": "sight", "city": "San Sebastián", "region": "Basque Country", "days": [11], "lat": 43.3247506, "lng": -1.9933024, "confidence": "google", "open": {"11": "7:00 AM – 9:00 PM"}, "rating": 3.7, "ratings": 31}, {"name": "Santiago Airport", "kind": "other", "region": "Galicia", "days": [11], "lat": 42.8976422, "lng": -8.4189133, "notes": "Date: Day 11\nFlight: 4:25 PM SCQ to BIO (booked)\nNotes: ~1 hr drive from A Coruna. Allow time for pet check-in logistics.", "confidence": "exact", "open": {"11": "Open 24 hours"}, "rating": 4.2, "ratings": 8690, "website": "https://www.aena.es/es/santiago-rosalia-de-castro.html?utm_source=Google&utm_medium=GMB_SCQ"}, {"name": "Ama", "kind": "other", "region": "Basque Country", "days": [12], "stars": 1, "lat": 43.1321258, "lng": -2.0776803999999998, "notes": "Day: Day 12\nLocation: Tolosa (~30 min inland from San Seb)\nStars: 1 Michelin star\nHours: Fri 13:30-18:00 and 20:30-24:00\nDog: Call to confirm\nReserve: +34 943 38 20 59\nNotes: Farm-to-table, relationships with local producers. No children under 8.", "confidence": "google", "outdoor": true, "open": {"12": "1:30 – 6:00 PM, 8:30 PM – 12:00 AM"}, "rating": 4.7, "ratings": 670, "website": "https://www.amatolosa.com/", "price": "PRICE_LEVEL_VERY_EXPENSIVE"}, {"name": "Bodega K5", "kind": "other", "city": "Gipuzkoa", "region": "Basque Country", "days": [12], "lat": 43.2364978, "lng": -2.1486633, "notes": "Day: Day 12— public holiday, may be open)\nLocation: Aia, near Pagoeta Natural Park\nType: Txakoli winery at 300m altitude\nHours: Tours at 11:00, 75 min, max 15 visitors\nDog: Call to confirm\nReserve: +34 943 24 00 05 or bodega@txakolina-k5.com\nNotes: Founded by 5 friends including celebrity chef Karlos Arguinano. Includes traditional hamaiketako \"11 o'clock snack.\"", "confidence": "weak", "open": {}}, {"name": "Martin Berasategui", "kind": "other", "region": "Basque Country", "days": [12], "dog": "friendly", "stars": 3, "lat": 43.266225999999996, "lng": -2.016205, "notes": "Day: Day 12 alternative\nLocation: Lasarte-Oria (~15 min from San Seb)\nStars: 3 Michelin stars\nHours: Open Fri for lunch and dinner\nDog: Likely no — confirm directly\nReserve: martinberasategui.com — book far ahead", "confidence": "google", "dogSrc": "google", "open": {"12": "Open 24 hours"}, "rating": 4.2, "ratings": 24}, {"name": "Monte Ulia", "kind": "sight", "city": "San Sebastián", "region": "Basque Country", "days": [12], "dog": "off-leash", "lat": 43.32192, "lng": -1.9577423, "notes": "Day: Day 12\nLocation: East end of San Sebastian (from Zurriola Beach)\nDog: OFF-LEASH 18:00-12:00 (noon) — exceptional for morning walks\nNotes: San Sebastian's \"wildest\" mountain. Dramatic cliff-top paths, hidden coves, ancient whale-watching lookout points. Talaia Trail is the most secluded.", "confidence": "exact", "dogSrc": "you", "dogWhy": "Monte Ulia walk (off-leash before noon, exceptional sea views)", "open": {"12": "Open 24 hours"}, "rating": 4.7, "ratings": 306, "website": "https://www.sansebastianturismoa.eus/es/hacer/barrio-barrio/gros?utm_source=google&utm_medium=my_business&utm_campaign=monte_ulia#monte_ulia"}, {"name": "Pasaia Fishing Village", "kind": "other", "city": "Gipuzkoa", "region": "Basque Country", "days": [12], "lat": 43.3239952, "lng": -1.9200587, "notes": "Day: Day 12\nLocation: ~10 min east of San Sebastian\nNotes: Charming fishing village. Can combine with Monte Ulia walk.", "confidence": "exact", "open": {}, "rating": 4.5, "ratings": 27, "website": "https://pasaiaitsasfestibala.org/"}, {"name": "Guggenheim Bilbao", "kind": "other", "city": "Bizkaia", "region": "Basque Country", "days": [13], "lat": 43.2630018, "lng": -2.9350039, "notes": "Day: Day 13 — if time before flight\nLocation: Bilbao\nDog: No dogs inside; dog can enjoy Nervion River promenade\nNotes: Quick stop for exterior photos. The building itself and the Puppy flower sculpture are the experience.", "confidence": "exact", "open": {"13": "10:00 AM – 8:00 PM"}, "summary": "Gleaming titanium and glass museum, designed by Frank Gehry, housing major 20th-century artworks.", "rating": 4.5, "ratings": 95544, "website": "https://www.guggenheim-bilbao.eus/"}], "dayCount": 13, "kindColour": {"restaurant": "#c1443c", "cafe": "#b5651d", "winery": "#7b3f6b", "market": "#1f7a5a", "sight": "#2f6ea8", "beach": "#0f8ba8", "lodging": "#4a4a4a", "air": "#6b6b6b", "car": "#6b6b6b", "activity": "#3f7a3f", "other": "#787878"}, "kindLabel": {"restaurant": "Eat", "cafe": "Coffee", "winery": "Wine", "market": "Market", "sight": "See", "beach": "Beach", "lodging": "Stay", "activity": "Do", "air": "Flight", "car": "Car", "other": "Other"}};
const P = DATA.places;
const COL = DATA.kindColour, LAB = DATA.kindLabel;

const state = {day:null, kinds:new Set(), dog:false, booked:false, exact:false,
               near:false, open:false, outdoor:false, here:null, sel:null,
               q:'', regions:new Set()};

// Every value below comes from Ben's sheet, his map pins or Google, and all
// three are free text. One apostrophe in a restaurant name is not a security
// question here, but a stray "<" silently eating the rest of a card is a place
// vanishing off the map, which is.
const esc = s => String(s||'').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const map = L.map('map', {zoomControl:false}).setView([43.2,-5.6], 7);
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);

const layer = L.layerGroup().addTo(map);
let hereMarker = null;

// Ordinals, never dates: this page is public and carries the lodging.
const fmtDay = n => 'Day '+n;
// The SAME rule sheet.fold applies in Python, for the same reason: a search box
// over Spanish, Galician and Basque names must match the spelling Ben types.
// "limon" has to find "Sr. Limón", "penas" has to find "Peñas", and "sr limon"
// has to find it with the full stop he will not type. Accents and punctuation
// are folded away; everything else is left alone.
const fold = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
// Every term must match, so "limon coruna" narrows rather than widens.
const terms = () => fold(state.q).split(' ').filter(Boolean);
const REGION_UNKNOWN = '\u2014 region unknown \u2014';
const dist = (a,b,c,d) => {          // km, haversine
  const R=6371, r=Math.PI/180;
  const dLa=(c-a)*r, dLo=(d-b)*r;
  const h=Math.sin(dLa/2)**2 + Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
};

function chip(parent, label, pressed, onClick){
  const b=document.createElement('button');
  b.className='chip'; b.textContent=label;
  b.setAttribute('aria-pressed', pressed?'true':'false');
  b.onclick=()=>{ onClick(); render(); };
  parent.appendChild(b); return b;
}

function buildFilters(){
  // Ordered by the earliest day Ben is in each, so the row reads in the order
  // he drives it rather than alphabetically.
  const first={};
  P.forEach(p=>{
    const r=p.region||REGION_UNKNOWN;
    const d=p.days.length?Math.min(...p.days):99;
    if(first[r]===undefined||d<first[r]) first[r]=d;
  });
  const regions=Object.keys(first).sort((a,b)=>
    (a===REGION_UNKNOWN)-(b===REGION_UNKNOWN) || first[a]-first[b] || a.localeCompare(b));
  const fr=document.getElementById('fRegion'); fr.innerHTML='';
  if(regions.length>1){
    chip(fr,'All regions', state.regions.size===0, ()=>state.regions.clear());
    regions.forEach(r=>{
      const n=P.filter(p=>(p.region||REGION_UNKNOWN)===r).length;
      chip(fr, `${r} ${n}`, state.regions.has(r),
        ()=>state.regions.has(r)?state.regions.delete(r):state.regions.add(r));
    });
  }

  const days=[...new Set(P.flatMap(p=>p.days))].sort((a,b)=>a-b);
  const fd=document.getElementById('fDay'); fd.innerHTML='';
  chip(fd,'All days', state.day===null, ()=>state.day=null);
  days.forEach(d=>chip(fd, fmtDay(d), state.day===d, ()=>state.day = state.day===d?null:d));

  const kinds=[...new Set(P.map(p=>p.kind))]
      .sort((a,b)=>(LAB[a]||a).localeCompare(LAB[b]||b));
  const fk=document.getElementById('fKind'); fk.innerHTML='';
  kinds.forEach(k=>chip(fk, LAB[k]||k, state.kinds.has(k),
      ()=>state.kinds.has(k)?state.kinds.delete(k):state.kinds.add(k)));

  const ff=document.getElementById('fFlag'); ff.innerHTML='';
  chip(ff,'🐕 dog OK', state.dog, ()=>state.dog=!state.dog);
  chip(ff,'☂ terrace', state.outdoor, ()=>state.outdoor=!state.outdoor);
  // Only offered with a day chosen: "open" has no meaning without one, and a
  // filter that silently does nothing is worse than one that is not there.
  if(state.day) chip(ff,'Open that day', state.open, ()=>state.open=!state.open);
  chip(ff,'Booked', state.booked, ()=>state.booked=!state.booked);
  chip(ff,'Exact pins only', state.exact, ()=>state.exact=!state.exact);
  chip(ff,'📍 Near me', state.near, ()=>{
    state.near=!state.near;
    if(state.near) locate();
  });
}

function locate(){
  if(!navigator.geolocation){ alert('This browser has no location service.'); return; }
  navigator.geolocation.watchPosition(pos=>{
    state.here=[pos.coords.latitude, pos.coords.longitude];
    if(hereMarker) map.removeLayer(hereMarker);
    hereMarker=L.circleMarker(state.here,{radius:7,color:'#fff',weight:2,
      fillColor:'#2f6ea8',fillOpacity:1}).addTo(map).bindPopup('You are here');
    render();
  }, err=>{ alert('Location unavailable: '+err.message); state.near=false; render(); },
     {enableHighAccuracy:true, maximumAge:15000, timeout:15000});
}

function visible(){
  const want=terms();
  let out = P.filter(p=>{
    if(state.regions.size && !state.regions.has(p.region||REGION_UNKNOWN)) return false;
    if(want.length){
      // Name, town and region. NOT the notes: Ben asked to find a place by
      // name, and matching free text would surface a restaurant because its
      // note mentions the town he searched for.
      const hay=fold(p.name+' '+(p.city||'')+' '+(p.region||''));
      if(!want.every(t=>hay.includes(t))) return false;
    }
    if(state.day && !p.days.includes(state.day)) return false;
    if(state.kinds.size && !state.kinds.has(p.kind)) return false;
    if(state.dog && !(p.dog==='friendly'||p.dog==='off-leash')) return false;
    if(state.outdoor && !p.outdoor) return false;
    // "Open that day" hides only places we can PROVE are shut. A place with no
    // published hours is unknown, and hiding the unknown ones would quietly
    // shrink the map to the 124 of 169 that Google has hours for.
    if(state.open && state.day && (p.shut||[]).includes(state.day)) return false;
    if(state.booked && !p.commitment) return false;
    if(state.exact && p.confidence!=='exact') return false;
    return true;
  });
  if(state.near && state.here){
    out.forEach(p=>p._km=dist(state.here[0],state.here[1],p.lat,p.lng));
    out.sort((a,b)=>a._km-b._km);
  }
  return out;
}

function dirLinks(p){
  const nav=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
  const search=`https://www.google.com/maps/search/?api=1&query=`+
        encodeURIComponent(p.name+' '+(p.city||''));
  let html=`<a class="btn solid" target="_blank" rel="noopener" href="${nav}">Directions</a>`;
  // An approximate pin is the STREET, not the door. Offer Google's own search
  // as well rather than navigating confidently to the wrong building.
  if(p.confidence!=='exact')
    html+=`<a class="btn" target="_blank" rel="noopener" href="${search}">Find on Google</a>`;
  // The 45 with no published hours are the August-closure risk, and their own
  // site is the only place that answers it. http(s) only: these URLs come from
  // an API, and a javascript: one would run on tap.
  if(p.website && /^https?:\/\//i.test(p.website))
    html+=`<a class="btn" target="_blank" rel="noopener" href="${esc(p.website)}">Website</a>`;
  return html;
}

// Where a dog rule came from, shown on the badge. "you phoned them" and
// "Google has a checkbox" are not the same claim and the badge should not
// flatten them — 24 of these are Ben's own words and 24 more are Google's
// attribute, and only one of those two has ever been wrong about a terrace.
const SRC = {you:' · your note', map:' · your map pin', google:' · Google'};

function badges(p){
  let b='';
  if(p.stars) b+=`<span class="b star">${'★'.repeat(p.stars)} Michelin</span>`;
  const s = SRC[p.dogSrc]||'';
  if(p.dog==='friendly') b+=`<span class="b dog">🐕 dog-friendly${s}</span>`;
  if(p.dog==='off-leash') b+=`<span class="b dog">🐕 off-leash OK${s}</span>`;
  if(p.dog==='no') b+=`<span class="b nodog">🚫 no dogs${s}</span>`;
  // A question Ben wrote down is not an answer. Showing it as one would be the
  // single most expensive thing this page could do.
  if(p.dog==='asked') b+='<span class="b ask">🐕? you meant to check</span>';
  if(p.outdoor) b+='<span class="b">☂ terrace</span>';
  if(p.commitment) b+='<span class="b book">BOOKED</span>';
  if(p.status) b+=`<span class="b shut">${p.status.replace(/_/g,' ')}</span>`;
  if(state.day && (p.shut||[]).includes(state.day))
    b+=`<span class="b shut">SHUT on ${fmtDay(state.day)}</span>`;
  if(p.rating) b+=`<span class="b">★ ${p.rating}${p.ratings?' ('+p.ratings+')':''}</span>`;
  if(p.confidence==='weak') b+='<span class="b warn">⚠ approximate</span>';
  if(p.confidence==='map') b+='<span class="b warn">⚠ unverified pin</span>';
  return b;
}

// The hours for whichever day is selected. Blank when no day is chosen, and
// blank for the 45 places that publish none — which is the honest rendering,
// because an August closure cannot be checked for those at all.
function hoursLine(p){
  if(!state.day || !p.open) return '';
  return p.open[String(state.day)] || '';
}

function render(){
  buildFilters();
  const vis=visible();
  document.getElementById('count').textContent =
    `${vis.length} of ${P.length} places` +
    (state.q.trim()?` · “${state.q.trim()}”`:'') +
    (state.regions.size?' · '+[...state.regions].join(', '):'') +
    (state.near&&state.here?' · nearest first':'') +
    (state.day?` · ${fmtDay(state.day)}`:'');
  const clear=document.getElementById('qx');
  if(clear) clear.hidden = !state.q;

  layer.clearLayers();
  vis.forEach(p=>{
    const m=L.circleMarker([p.lat,p.lng],{radius:7,weight:2,color:'#fff',
      fillColor:COL[p.kind]||'#787878',fillOpacity:.95}).addTo(layer);
    m.bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.city)}` +
      (hoursLine(p)?`<div class="hrs">🕑 ${esc(hoursLine(p))}</div>`:'') +
      `<div class="badges">${badges(p)}</div>` +
      `<div class="acts">${dirLinks(p)}</div>`);
    m.on('click',()=>{ state.sel=p.name; drawList(vis); });
  });
  drawList(vis);
  if(vis.length && !state.near){
    const g=L.featureGroup(layer.getLayers());
    try{ map.fitBounds(g.getBounds().pad(.15)); }catch(e){}
  }
}

function drawList(vis){
  const el=document.getElementById('list');
  if(!vis.length){ el.innerHTML='<div class="empty">Nothing matches those filters.</div>'; return; }
  el.innerHTML = vis.map(p=>{
    const days=p.days.map(fmtDay).join(', ');
    const km = (p._km!==undefined) ? ` · ${p._km<1?Math.round(p._km*1000)+' m':p._km.toFixed(1)+' km'}` : '';
    return `<div class="item ${state.sel===p.name?'sel':''}" data-n="${encodeURIComponent(p.name)}">
      <div class="nm"><span class="dot" style="background:${COL[p.kind]||'#787878'}"></span>${esc(p.name)}</div>
      <div class="meta">${esc(LAB[p.kind]||p.kind)}${p.city?' · '+esc(p.city):''}${days?' · '+days:''}${km}</div>
      <div class="badges">${badges(p)}</div>
      ${hoursLine(p)?`<div class="hrs">🕑 ${esc(hoursLine(p))}</div>`:''}
      ${p.summary?`<div class="known">${esc(p.summary)}</div>`:''}
      ${p.dogWhy?`<div class="why">you wrote: “${esc(p.dogWhy)}”</div>`:''}
      ${p.notes?`<div class="note">${esc(p.notes)}</div>`:''}
      <div class="acts">${dirLinks(p)}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.item').forEach(node=>{
    node.onclick=e=>{
      if(e.target.tagName==='A') return;
      const n=decodeURIComponent(node.dataset.n);
      const p=P.find(x=>x.name===n);
      state.sel=n; map.setView([p.lat,p.lng], 15); drawList(visible());
    };
  });
}

// The search box. `input` rather than `change`, so it filters as he types --
// on a phone, waiting for a blur is waiting for a tap somewhere harmless.
const box=document.getElementById('q');
box.addEventListener('input', ()=>{ state.q=box.value; render(); });
// Enter must not submit anything: there is no form and no server, and on iOS a
// submit attempt closes the keyboard and scrolls the page to the top.
box.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); box.blur(); } });
document.getElementById('qx').addEventListener('click', ()=>{
  state.q=''; box.value=''; box.focus(); render();
});

render();
</script>
